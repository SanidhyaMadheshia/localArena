# Defaults are production-shaped; values-dev.yaml relaxes them for kind.
image:
  # Optional prefix for every image (e.g. <account>.dkr.ecr.<region>.amazonaws.com); empty = as-is.
  registry: ""
  api: { repository: localarena/api, tag: dev, pullPolicy: IfNotPresent }
  gameserver: { repository: localarena/gameserver, tag: dev, pullPolicy: IfNotPresent }

api:
  replicas: 2
  # Rollout: surge one new pod before removing an old one, never below capacity.
  maxSurge: 1
  maxUnavailable: 0
  resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 192Mi } }
  hpa: { enabled: true, min: 2, max: 6, cpuUtilization: 70 }
  legacyV1: true
  drainSeconds: 5
  # Canary: a second Deployment with its own image tag behind the same Service;
  # traffic share = canary replicas / total replicas (adr/0019).
  canary: { enabled: false, tag: dev, replicas: 1 }

gameserver:
  replicas: 1
  roundSeconds: 120
  # Must exceed roundSeconds + drain margin so a round can finish (adr/0018).
  terminationGracePeriodSeconds: 150
  allowGuests: true
  resources: { requests: { cpu: 200m, memory: 64Mi }, limits: { memory: 256Mi } }
  # Durable event spool used while Kafka is down (EVENT_SPOOL_DIR). emptyDir
  # survives container restarts but not pod replacement; pvc.enabled keeps it
  # across pods only for replicas: 1 (ReadWriteOnce).
  spool:
    enabled: true
    sizeLimit: 512Mi
    pvc: { enabled: false, size: 1Gi, storageClass: "" }

# Kafka clients. Empty bootstrap = events disabled (current behaviour).
kafka:
  bootstrap: ""
  auth:
    enabled: false              # TLS + SCRAM; needs the KafkaUser Secrets in this namespace
    mechanism: SCRAM-SHA-512
    caSecret: localarena-cluster-ca-cert
    caKey: ca.crt
  # KafkaUser name per service; the Strimzi Secret of the same name (key
  # `password`) must exist in the release namespace.
  users:
    gameserver: localarena-gameserver

# Extra spread across availability zones (in addition to per-node spread).
spread:
  zone: false

postgres:
  instances: 2
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage: 1Gi
  storageClass: ""   # empty = cluster default
  poolerInstances: 2

migrate:
  # Runs as a pre-install/pre-upgrade hook: a failing migration aborts the
  # release before any new pod starts (atomic upgrades roll back).
  enabled: true
  backoffLimit: 1
  # Drill only: inject a failing statement to prove an atomic rollback.
  failForDrill: false

valkey: { enabled: true }
opa: { enabled: true }
flagd: { enabled: true }

ingress:
  enabled: false
  className: nginx
  host: localarena.localtest.me

oidc:
  issuer: ""        # empty disables /v2 auth in the cluster
  jwksURL: ""

secrets:
  # Name of an existing Secret with GAME_TICKET_SECRET / WEBHOOK_SIGNING_SECRET
  # (created from SOPS by `make k8s-secrets`); empty = none.
  existing: ""

# Defaults are production-shaped; values-dev.yaml relaxes them for kind.
image:
  api: { repository: localarena/api, tag: dev, pullPolicy: IfNotPresent }
  gameserver: { repository: localarena/gameserver, tag: dev, pullPolicy: IfNotPresent }

api:
  replicas: 2
  # Rollout: surge one new pod before removing an old one, never below capacity.
  maxSurge: 1
  maxUnavailable: 0
  resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 192Mi } }
  hpa: { enabled: true, min: 2, max: 6, cpuUtilization: 70 }
  legacyV1: true
  drainSeconds: 5
  # Canary: a second Deployment with its own image tag behind the same Service;
  # traffic share = canary replicas / total replicas (adr/0019).
  canary: { enabled: false, tag: dev, replicas: 1 }

gameserver:
  replicas: 1
  roundSeconds: 120
  # Must exceed roundSeconds + drain margin so a round can finish (adr/0018).
  terminationGracePeriodSeconds: 150
  allowGuests: true
  resources: { requests: { cpu: 200m, memory: 64Mi }, limits: { memory: 256Mi } }

postgres:
  instances: 2
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage: 1Gi
  poolerInstances: 2

migrate:
  # Runs as a pre-install/pre-upgrade hook: a failing migration aborts the
  # release before any new pod starts (atomic upgrades roll back).
  enabled: true
  backoffLimit: 1
  # Drill only: inject a failing statement to prove an atomic rollback.
  failForDrill: false

valkey: { enabled: true }
opa: { enabled: true }
flagd: { enabled: true }

ingress:
  enabled: false
  className: nginx
  host: localarena.localtest.me

oidc:
  issuer: ""        # empty disables /v2 auth in the cluster
  jwksURL: ""

secrets:
  # Name of an existing Secret with GAME_TICKET_SECRET / WEBHOOK_SIGNING_SECRET
  # (created from SOPS by `make k8s-secrets`); empty = none.
  existing: ""

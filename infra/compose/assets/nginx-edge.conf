# Edge cache in front of the Garage website endpoint (two identical instances,
# edge-a :8090 and edge-b :8091, simulate two CDN PoPs with independent caches).
#
# Asset URLs are immutable: /assets/<name>.<content-hash>.<ext>. A new version
# is a new URL, so caching for a year is safe and "invalidation" is just
# publishing a new manifest. Only manifest.json is short-lived.
proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:10m max_size=256m inactive=7d use_temp_path=off;

log_format edge '$remote_addr "$request" $status $body_bytes_sent cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    access_log /dev/stdout edge;

    location /healthz { return 200 "ok\n"; }

    location ~ "^/assets/[A-Za-z0-9_-]+\.[0-9a-f]{12}\.[a-z0-9]+$" {
        proxy_pass http://garage:3902;
        proxy_set_header Host assets.web.garage.localhost;
        proxy_cache assets;
        proxy_cache_key $uri;               # query strings never fragment the cache
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 10s;          # a not-yet-uploaded asset is retried soon
        proxy_cache_lock on;                # collapse concurrent misses: one origin fetch per key
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Edge $hostname always;
    }

    # The manifest maps logical names to hashed URLs; clients revalidate it often.
    location = /assets/manifest.json {
        proxy_pass http://garage:3902;
        proxy_set_header Host assets.web.garage.localhost;
        proxy_cache assets;
        proxy_cache_key $uri;
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=5" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Edge $hostname always;
    }

    location / { return 404; }
}

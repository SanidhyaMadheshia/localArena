# Envoy edge for the LocalArena API (adr/0007, security: adr/0015).
# Every listener: WAF-style deny route for obvious attack patterns (path
# traversal, script tags, UNION SELECT, log4shell), 16 KB header cap, and a
# global token bucket (1000 req/s, burst 2000) that sheds overload with 429
# before it reaches the API. Per-user/per-IP limits stay in the API (Valkey).
#   :10000  least request   -> cluster api_lr   (default; adr/0007)
#   :10001  round robin     -> cluster api_rr   (same 3 replicas, for comparison)
#   :8443   TLS (TLS 1.2+, h2) -> cluster api_lr; certs from scripts/tls-certs.sh
#   :9901   admin (published on host loopback only; /stats/prometheus, /clusters)
#
# Timeout budget: route 4 s > API request 3 s > Postgres statement 2 s.
# Retries only where they cannot duplicate work:
#   - any method: the request never reached an upstream (connect failure,
#     refused stream, reset before request);
# Per-try timeout 2.5 s > DB statement timeout 2 s: a slow shared DB answers
# as a no-retry 503 from the API; only a hung replica is cut off and retried.
#   - GET/PUT (idempotent by HTTP semantics), or writes carrying Idempotency-Key: also 5xx/timeouts, on a
#     different host (previous_hosts), with backoff.
# All retries are capped by a retry budget (20% of active requests, floor 10
# concurrent retries; a floor of 3 overflowed when a replica died, Exp. 003).
# Expanded (no anchors): Envoy rejects unknown top-level keys. JSON is valid YAML.

# Envoy edge for the LocalArena API (adr/0007).
#   :10000  least request   -> cluster api_lr   (default; adr/0007)
#   :10001  round robin     -> cluster api_rr   (same 3 replicas, for comparison)
#   :9901   admin (published on host loopback only; /stats/prometheus, /clusters)
#
# Timeout budget: route 4 s > API request 3 s > Postgres statement 2 s.
# Retries only where they cannot duplicate work:
#   - any method: the request never reached an upstream (connect failure,
#     refused stream, reset before request);
# Per-try timeout 2.5 s > DB statement timeout 2 s: a slow shared DB answers
# as a no-retry 503 from the API; only a hung replica is cut off and retried.
#   - GET/PUT (idempotent by HTTP semantics), or writes carrying Idempotency-Key: also 5xx/timeouts, on a
#     different host (previous_hosts), with backoff.
# All retries are capped by a retry budget (20% of active requests, floor 10
# concurrent retries; a floor of 3 overflowed when a replica died, Exp. 003).
# Expanded (no anchors): Envoy rejects unknown top-level keys. JSON is valid YAML.
{
 "admin": {
  "address": {
   "socket_address": {
    "address": "0.0.0.0",
    "port_value": 9901
   }
  }
 },
 "static_resources": {
  "listeners": [
   {
    "name": "rr",
    "address": {
     "socket_address": {
      "address": "0.0.0.0",
      "port_value": 10001
     }
    },
    "filter_chains": [
     {
      "filters": [
       {
        "name": "envoy.filters.network.http_connection_manager",
        "typed_config": {
         "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
         "stat_prefix": "rr",
         "use_remote_address": true,
         "request_timeout": "10s",
         "common_http_protocol_options": {
          "idle_timeout": "60s"
         },
         "route_config": {
          "name": "api_rr",
          "virtual_hosts": [
           {
            "name": "api",
            "domains": [
             "*"
            ],
            "routes": [
             {
              "match": {
               "prefix": "/",
               "headers": [
                {
                 "name": ":method",
                 "string_match": {
                  "safe_regex": {
                   "regex": "^(GET|PUT)$"
                  }
                 }
                }
               ]
              },
              "route": {
               "cluster": "api_rr",
               "timeout": "4s",
               "retry_policy": {
                "retry_on": "connect-failure,refused-stream,reset-before-request,5xx,gateway-error",
                "num_retries": 2,
                "per_try_timeout": "2.5s",
                "retry_host_predicate": [
                 {
                  "name": "envoy.retry_host_predicates.previous_hosts",
                  "typed_config": {
                   "@type": "type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate"
                  }
                 }
                ],
                "host_selection_retry_max_attempts": 3,
                "retry_back_off": {
                 "base_interval": "0.025s",
                 "max_interval": "0.25s"
                }
               }
              }
             },
             {
              "match": {
               "prefix": "/",
               "headers": [
                {
                 "name": "idempotency-key",
                 "present_match": true
                }
               ]
              },
              "route": {
               "cluster": "api_rr",
               "timeout": "4s",
               "retry_policy": {
                "retry_on": "connect-failure,refused-stream,reset-before-request,5xx,gateway-error",
                "num_retries": 2,
                "per_try_timeout": "2.5s",
                "retry_host_predicate": [
                 {
                  "name": "envoy.retry_host_predicates.previous_hosts",
                  "typed_config": {
                   "@type": "type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate"
                  }
                 }
                ],
                "host_selection_retry_max_attempts": 3,
                "retry_back_off": {
                 "base_interval": "0.025s",
                 "max_interval": "0.25s"
                }
               }
              }
             },
             {
              "match": {
               "prefix": "/"
              },
              "route": {
               "cluster": "api_rr",
               "timeout": "4s",
               "retry_policy": {
                "retry_on": "connect-failure,refused-stream,reset-before-request",
                "num_retries": 2,
                "retry_host_predicate": [
                 {
                  "name": "envoy.retry_host_predicates.previous_hosts",
                  "typed_config": {
                   "@type": "type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate"
                  }
                 }
                ],
                "retry_back_off": {
                 "base_interval": "0.025s",
                 "max_interval": "0.25s"
                }
               }
              }
             }
            ]
           }
          ]
         },
         "http_filters": [
          {
           "name": "envoy.filters.http.router",
           "typed_config": {
            "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
           }
          }
         ]
        }
       }
      ]
     }
    ]
   },

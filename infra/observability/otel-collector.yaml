# OpenTelemetry Collector: receives OTLP from services, batches, exports traces
# to Tempo. memory_limiter first so a burst of spans cannot OOM the collector.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 200, spike_limit_mib: 50 }
  batch: { timeout: 2s, send_batch_size: 1024 }
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      readers: [{ pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } } }]
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }

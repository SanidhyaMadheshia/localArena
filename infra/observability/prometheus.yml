global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]

scrape_configs:
  - job_name: gameserver
    static_configs: [{ targets: ["gameserver:8080"] }]
  - job_name: api # every replica via Docker DNS
    dns_sd_configs: [{ names: ["api"], type: A, port: 8081 }]
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["envoy:9901"] }]
  - job_name: rewards
    static_configs: [{ targets: ["rewards:9102"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: pgbouncer
    static_configs: [{ targets: ["pgbouncer-exporter:9127"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]

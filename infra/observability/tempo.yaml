# Tempo single binary, local storage, 24 h retention (lab).
stream_over_http_enabled: true
server: { http_listen_port: 3200 }
distributor:
  receivers:
    otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 } } }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }
backend_worker:
  compaction: { block_retention: 24h } # Tempo 3: retention moved from compactor to backend worker

# Kafka 4.3.1 KRaft: 3 combined controller+broker nodes spread across zones.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: localarena
spec:
  replicas: 3
  roles: [controller, broker]
  storage:               # overlays patch size/class
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: { memory: 768Mi, cpu: 200m }
    limits: { memory: 1Gi }
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  template:
    pod:
      # Guarantees one broker per zone on every platform (rack.topologyKey only labels the broker).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { strimzi.io/cluster: localarena, strimzi.io/name: localarena-kafka }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: localarena
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    metadataVersion: "4.3"
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - localarena-admin
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources: { requests: { memory: 256Mi, cpu: 50m }, limits: { memory: 384Mi } }
    userOperator:
      resources: { requests: { memory: 256Mi, cpu: 50m }, limits: { memory: 384Mi } }
  kafkaExporter:
    topicRegex: "game\\..*"
    groupRegex: ".*"
    resources: { requests: { memory: 64Mi, cpu: 20m }, limits: { memory: 128Mi } }
  cruiseControl:
    resources: { requests: { memory: 512Mi, cpu: 100m }, limits: { memory: 768Mi } }
    jvmOptions:
      "-Xms": 256m
      "-Xmx": 384m

# kind: 2Gi volumes on the default `standard` (local-path) StorageClass.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: KafkaNodePool, name: dual-role }
    patch: |-
      - op: replace
        path: /spec/storage/volumes/0/size
        value: 2Gi
      - op: add
        path: /spec/storage/volumes/0/class
        value: standard

# Strimzi cluster operator (chart strimzi/strimzi-kafka-operator 1.3.1, supports Kafka 4.3.1 KRaft).
# Operator lives in strimzi-system and only watches the data namespace.
# helm upgrade --install strimzi strimzi/strimzi-kafka-operator --version 1.3.1 \
#   -n strimzi-system --create-namespace -f infra/kubernetes/helm/strimzi-values.yaml
watchNamespaces: [data]
watchAnyNamespace: false
generateNetworkPolicy: true
resources:
  requests: { memory: 256Mi, cpu: 100m }
  limits: { memory: 384Mi, cpu: 500m }

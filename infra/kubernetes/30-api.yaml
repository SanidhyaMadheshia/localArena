# LocalArena API. Writes go through the CNPG pooler; reads may use the
# read-only service (replicas) with LSN-based read-your-writes fallback.
# NOTE: no authentication yet (week 5). The Service is ClusterIP only;
# reach it with: kubectl -n localarena port-forward svc/api 8081:8081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: localarena
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 20 # > DRAIN_SECONDS + in-flight requests
      topologySpreadConstraints: # one API replica per worker; ScheduleAnyway put both on one node
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector: { matchLabels: { app: api } }
          matchLabelKeys: [pod-template-hash] # spread each ReplicaSet on its own during rollouts
      containers:
        - name: api
          image: localarena/api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: arena-db-app, key: password } }
            # Keyword/value DSNs avoid URL-escaping the generated password.
            - name: DATABASE_URL
              value: "host=arena-db-pooler-rw port=5432 dbname=localarena user=localarena password=$(DB_PASSWORD)"
            - name: REPLICA_URL
              value: "host=arena-db-ro port=5432 dbname=localarena user=localarena password=$(DB_PASSWORD)"
            - name: DB_MAX_CONNS
              value: "10"
            - name: VALKEY_ADDR
              value: "valkey:6379"
            - name: DRAIN_SECONDS
              value: "5" # endpoints are removed when readiness fails (periodSeconds 5 x 2)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Liveness must not depend on the database, or a DB outage restarts every pod.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: localarena
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
# Voluntary disruptions (node drain, upgrades) must leave at least one API pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: localarena
spec:
  minAvailable: 1
  selector: { matchLabels: { app: api } }

# Default StorageClass for EKS: encrypted gp3, zone-aware binding, expandable, volumes survive PVC deletion.
# scripts/aws-up.sh applies this and removes the default annotation from gp2.
# reclaimPolicy Retain: aws-teardown.sh deletes PVs and then leftover EBS volumes by tag.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain

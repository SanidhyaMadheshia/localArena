# LocalArena local stack. Start: docker compose up -d --build
# Profiles: "observability" (Prometheus), "load" (bot swarm), "shards" (2 extra Postgres for the router prototype).
# Passwords below are local-only defaults; override via environment, never reuse elsewhere.
name: localarena

x-pg: &pg
  image: postgres:18.6-alpine
  environment: &pgenv
    POSTGRES_USER: localarena
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localarena-dev}
    POSTGRES_DB: localarena
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U localarena -d localarena"]
    interval: 2s
    timeout: 3s
    retries: 30
  deploy:
    resources:
      limits: { cpus: "2", memory: 512M }

# Shared server settings: lock/deadlock visibility and query statistics.
x-pg-cmd: &pgcmd
  - postgres
  - -c
  - shared_preload_libraries=pg_stat_statements
  - -c
  - log_lock_waits=on
  - -c
  - deadlock_timeout=200ms
  - -c
  - track_io_timing=on
  - -c
  - max_connections=100
  - -c
  - wal_level=logical # Debezium CDC (outbox); also keeps physical replication working
  - -c
  - max_replication_slots=10
  - -c
  - max_wal_senders=10

services:
  gameserver:
    build: { context: ., target: gameserver }
    image: localarena/gameserver:dev
    pull_policy: build
    # pprof listens on all container interfaces but is published on host loopback only.
    ports: ["8080:8080", "127.0.0.1:6060:6060"]
    environment:
      DEBUG_ADDR: ":6060"
      LOG_LEVEL: info
      # Events are optional: unreachable brokers only mean spooling (adr/0009).
      KAFKA_BROKERS: ${GAMESERVER_KAFKA:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      EVENT_SPOOL_DIR: /var/lib/gameserver/spool
      ALLOW_GUESTS: ${ALLOW_GUESTS:-1} # bots play as guests; set 0 to require game tickets
      TRUST_PLAYER_PARAM: ${TRUST_PLAYER_PARAM:-1} # LAB: bots -accounts play as accounts without tickets; 0 for a secure stack
      FLAGD_URL: http://flagd:8016
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    env_file: [{ path: .secrets.env, required: false }]
    command: ["-tick-hz", "20", "-capacity", "20", "-round-seconds", "${ROUND_SECONDS:-120}"]
    volumes: ["gameserver-spool:/var/lib/gameserver"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 512M }
    restart: unless-stopped

  postgres:
    <<: *pg
    command: *pgcmd
    environment:
      <<: *pgenv
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator-dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg-primary:/var/lib/postgresql
      - ./infra/compose/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro

  postgres-replica:
    <<: *pg
    user: postgres
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      <<: *pgenv
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator-dev}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pg-replica:/var/lib/postgresql
      - ./infra/compose/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Transaction pooling: a server connection is held only for one transaction,
  # so many app connections share few Postgres backends. Session state (SET,
  # advisory session locks, LISTEN) does not survive between transactions.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    environment:
      DATABASE_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@postgres:5432/localarena
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "500"
      MAX_PREPARED_STATEMENTS: "200" # pgx caches prepared statements; pgbouncer >=1.21 tracks them
      QUERY_WAIT_TIMEOUT: "5"         # seconds a client may wait for a server connection
      ADMIN_USERS: localarena
    ports: ["127.0.0.1:6432:5432"]
    depends_on:
      postgres: { condition: service_healthy }

  migrate:
    build: { context: ., target: api }
    image: localarena/api:dev
    pull_policy: build
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      # Migrations go direct to the primary: DDL with CONCURRENTLY cannot run through transaction pooling.
      DATABASE_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@postgres:5432/localarena
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # 3 stateless replicas, reachable only through Envoy (no host port).
  # Kill one:  docker kill localarena-api-2      Hang one: docker pause localarena-api-2
  api:
    image: localarena/api:dev
    pull_policy: build
    build: { context: ., target: api }
    environment:
      ADDR: ":8081"
      DATABASE_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@pgbouncer:5432/localarena
      REPLICA_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@postgres-replica:5432/localarena
      VALKEY_ADDR: valkey:6379
      CACHE_SINGLEFLIGHT: ${CACHE_SINGLEFLIGHT:-1}
      PROFILE_TTL: ${PROFILE_TTL:-30s}
      PROFILE_LOAD_DELAY: ${PROFILE_LOAD_DELAY:-0s} # experiments only: simulate an expensive cache fill
      TRUST_PROXY: "1"
      DRAIN_SECONDS: "5"
      # Week 5 auth (adr/0013). Issuer = the URL in tokens (browser-facing);
      # JWKS fetched over the internal network. v2 needs the security profile.
      OIDC_ISSUER: http://localhost:8180/realms/localarena
      OIDC_JWKS_URL: http://keycloak:8180/realms/localarena/protocol/openid-connect/certs
      OPA_URL: http://opa:8181
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      LEGACY_V1: ${LEGACY_V1:-1} # unauthenticated /v1 kept for bots/k6 experiments; set 0 for a secure stack
    env_file: [{ path: .secrets.env, required: false }] # GAME_TICKET_SECRET etc. (scripts/secrets-env.sh)
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      postgres-replica: { condition: service_healthy }
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1", memory: 256M }
    stop_grace_period: 20s # > DRAIN_SECONDS + in-flight requests
    restart: unless-stopped

  # Edge proxy: :10000 round robin, :10001 least request, admin on loopback :9901.
  envoy:
    image: envoyproxy/envoy:v1.40.0
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./infra/compose/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/compose/tls:/etc/envoy/tls:ro # scripts/tls-certs.sh
    ports: ["10000:10000", "10001:10001", "8443:8443", "127.0.0.1:9901:9901"]
    depends_on: [api]
    restart: unless-stopped

  # Cache/presence/rate limits. Disposable: no persistence, LRU eviction at 128 MB.
  valkey:
    image: valkey/valkey:9.0.6-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6380:6379"] # host 6379 is often taken by a system redis-server
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  # Object storage for maps/skins/replays (MinIO was archived upstream in 2026; Garage is the S3 replacement).
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node"]
    volumes:
      - ./infra/compose/assets/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    ports: ["127.0.0.1:3900:3900", "127.0.0.1:3902:3902"]
    restart: unless-stopped

  # Two independent caching edges ("PoPs") in front of Garage's website endpoint.
  edge-a: &edge
    image: nginx:1.31.7-alpine
    hostname: edge-a
    volumes: ["./infra/compose/assets/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro"]
    tmpfs: ["/var/cache/nginx"]
    ports: ["8090:80"]
    depends_on: [garage]
    restart: unless-stopped
  edge-b:
    <<: *edge
    hostname: edge-b
    ports: ["8091:80"]

  # ---- Week 4 "streaming" profile: docker compose --profile streaming up -d ----
  # 3 combined broker+controller nodes in KRaft mode (no ZooKeeper), pattern from
  # apache/kafka docker/examples (cluster/combined/plaintext). Internal listener
  # kafka-N:19092; host listener localhost:2N092. Heap capped for an 8 GiB Docker VM.
  kafka-1: &kafka
    profiles: ["streaming"]
    image: apache/kafka:4.3.1
    hostname: kafka-1
    environment: &kenv
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: bG9jYWxhcmVuYS1rYWZrYQ
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Durability defaults: RF 3, min ISR 2 -> acks=all survives one broker loss.
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are explicit design decisions (scripts/kafka-topics.sh)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports: ["127.0.0.1:29092:9092"]
    volumes: ["kafka-1:/var/lib/kafka/data"]
    deploy: { resources: { limits: { memory: 768M } } }
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment:
      <<: *kenv
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,HOST://localhost:39092
    ports: ["127.0.0.1:39092:9092"]
    volumes: ["kafka-2:/var/lib/kafka/data"]
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment:
      <<: *kenv
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,HOST://localhost:49092
    ports: ["127.0.0.1:49092:9092"]
    volumes: ["kafka-3:/var/lib/kafka/data"]

  kafka-ui:
    profiles: ["streaming"]
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: localarena
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      JAVA_OPTS: -Xmx256m
    ports: ["127.0.0.1:8085:8080"] # no auth: loopback only
    depends_on: [kafka-1]
    deploy: { resources: { limits: { memory: 512M } } }

  # Schema registry (protobuf contracts, compatibility rules). In-memory storage:
  # schemas are re-registered from schemas/ by scripts/register-schemas.sh.
  apicurio:
    profiles: ["streaming"]
    image: apicurio/apicurio-registry:3.3.3
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
      JAVA_OPTS_APPEND: -Xmx256m
    ports: ["127.0.0.1:8086:8080"]
    deploy: { resources: { limits: { memory: 512M } } }

  # Kafka Connect + Debezium: publishes the PostgreSQL outbox (adr/0010).
  connect:
    profiles: ["streaming"]
    image: quay.io/debezium/connect:3.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      GROUP_ID: localarena-connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      HEAP_OPTS: -Xmx384m
      # Secrets are resolved inside the worker (${env:...}), never stored in connector configs.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localarena-dev}
    ports: ["127.0.0.1:8083:8083"] # REST API has no auth: loopback only
    depends_on:
      kafka-1: { condition: service_healthy }
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 768M } } }
    restart: unless-stopped

  # Kafka Streams (leaderboard + sessions), 2 instances of one application id:
  # partitions/tasks split between them; 1 standby replica each for fast failover.
  streams-1: &streams
    profiles: ["streaming"]
    build: { context: ., dockerfile: streams/Dockerfile }
    image: localarena/streams:dev
    pull_policy: build
    hostname: streams-1
    environment: &senv
      KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      ADVERTISED_HOST: streams-1
      PORT: "7070"
      STANDBY_REPLICAS: ${STREAMS_STANDBY:-1}
    ports: ["127.0.0.1:7071:7070"]
    volumes: ["streams-1:/var/lib/streams"]
    depends_on: { kafka-1: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512M } } }
    restart: unless-stopped
  streams-2:
    <<: *streams
    hostname: streams-2
    environment:
      <<: *senv
      ADVERTISED_HOST: streams-2
    ports: ["127.0.0.1:7072:7070"]
    volumes: ["streams-2:/var/lib/streams"]

  # Reward saga worker (Go): match-events -> reward commands -> Postgres steps -> outbox.
  rewards:
    profiles: ["streaming"]
    image: localarena/api:dev
    pull_policy: build
    build: { context: ., target: api }
    entrypoint: ["/rewards"]
    environment:
      KAFKA_BROKERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DATABASE_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@pgbouncer:5432/localarena
    depends_on:
      kafka-1: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy: { resources: { limits: { memory: 128M } } }
    restart: unless-stopped

  # ---- Week 5 "security" profile ----
  # Keycloak (OIDC). Dev mode with an imported realm; lab-only users/passwords live
  # in the realm file. Hostname is fixed so tokens carry the same issuer for the
  # browser (localhost:8180) and for services inside the network (keycloak:8180).
  keycloak:
    profiles: ["security"]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev}
      JAVA_OPTS_KC_HEAP: -Xmx512m
    volumes: ["./infra/compose/keycloak/localarena-realm.json:/opt/keycloak/data/import/localarena-realm.json:ro"]
    ports: ["127.0.0.1:8180:8180"]
    deploy: { resources: { limits: { memory: 1G } } }

  # Open Policy Agent: authorization decisions (adr/0014). Policies are mounted read-only.
  opa:
    profiles: ["security"]
    image: openpolicyagent/opa:1.21.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policies"]
    volumes: ["./policies:/policies:ro"]
    ports: ["127.0.0.1:8181:8181"]
    deploy: { resources: { limits: { memory: 128M } } }

  # Feature flags (OpenFeature flagd). Edit flags.json: flagd hot-reloads it.
  # OFREP evaluation API on :8016 (adr/0015).
  flagd:
    image: ghcr.io/open-feature/flagd:v0.18.0
    command: ["start", "--uri", "file:/etc/flagd/flags.json"]
    volumes: ["./infra/compose/flagd:/etc/flagd:ro"]
    ports: ["127.0.0.1:8016:8016"]
    deploy: { resources: { limits: { memory: 64M } } }
    restart: unless-stopped

  # ---- Week 8 "regions" profile (adr/0021): a second region on the same host ----
  # Region A = existing gameserver/api/postgres primary. Region B = gameserver-b +
  # api-b, which reads its local replica and writes to region A's primary through
  # Toxiproxy (inter-region latency). Players reach both regions through Toxiproxy.
  toxiproxy:
    profiles: ["regions"]
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes: ["./infra/compose/regions/toxiproxy.json:/etc/toxiproxy.json:ro"]
    ports: ["127.0.0.1:8474:8474", "21080:21080", "21081:21081", "22080:22080", "22081:22081"]
  coredns:
    profiles: ["regions"]
    image: coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes: ["./infra/compose/regions:/etc/coredns:ro"]
    ports: ["127.0.0.1:1053:53/udp"]
  resolver: # caching resolver ("ISP DNS") for the TTL drill
    profiles: ["regions"]
    image: coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile.resolver"]
    volumes: ["./infra/compose/regions:/etc/coredns:ro"]
  gameserver-b:
    profiles: ["regions"]
    image: localarena/gameserver:dev
    pull_policy: build
    environment: { DEBUG_ADDR: "", LOG_LEVEL: info, ALLOW_GUESTS: "1" }
    command: ["-tick-hz", "20", "-capacity", "20", "-round-seconds", "${ROUND_SECONDS:-120}", "-seed", "1000"]
    deploy: { resources: { limits: { cpus: "2", memory: 256M } } }
  api-b:
    profiles: ["regions"]
    image: localarena/api:dev
    pull_policy: build
    environment:
      ADDR: ":8081"
      # Writes cross the WAN to region A's primary (single-writer); reads stay local.
      DATABASE_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@toxiproxy:25432/localarena
      REPLICA_URL: postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@postgres-replica:5432/localarena
      LEGACY_V1: "1"
      APP_REGION: b
    deploy: { resources: { limits: { cpus: "1", memory: 256M } } }

  pg-shard0:
    <<: *pg
    profiles: ["shards"]
    command: *pgcmd
    ports: ["127.0.0.1:5440:5432"]
    tmpfs: ["/var/lib/postgresql"]

  pg-shard1:
    <<: *pg
    profiles: ["shards"]
    command: *pgcmd
    ports: ["127.0.0.1:5441:5432"]
    tmpfs: ["/var/lib/postgresql"]

  # ---- Week 6 "observability" profile (adr/0016): docker compose --profile observability up -d ----
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
    deploy: { resources: { limits: { memory: 512M } } }
  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]
    deploy: { resources: { limits: { memory: 64M } } }
  alert-sink: # lab pager: receives Alertmanager webhooks (GET :9095/alerts)
    profiles: ["observability"]
    image: localarena/api:dev
    pull_policy: build
    build: { context: ., target: api }
    entrypoint: ["/alertsink"]
    ports: ["127.0.0.1:9095:9095"]
    deploy: { resources: { limits: { memory: 32M } } }
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    deploy: { resources: { limits: { memory: 256M } } }
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.0.4
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes: ["./infra/observability/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    deploy: { resources: { limits: { memory: 512M } } }
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.6.18
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./infra/observability/loki.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
    deploy: { resources: { limits: { memory: 384M } } }
  alloy: # ships container logs to Loki; reads the Docker socket (read-only mount)
    profiles: ["observability"]
    image: grafana/alloy:v1.20.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./infra/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy: { resources: { limits: { memory: 256M } } }
  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://localarena:${POSTGRES_PASSWORD:-localarena-dev}@postgres:5432/localarena?sslmode=disable
    command: ["--collector.replication", "--collector.replication_slots", "--collector.stat_replication"]
    deploy: { resources: { limits: { memory: 64M } } }
  kafka-exporter: # PM-002: consumer-group lag (Streams/rewards stopped = lag grows)
    profiles: ["observability"]
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka-1:19092", "--kafka.server=kafka-2:19092", "--kafka.server=kafka-3:19092"]
    deploy: { resources: { limits: { memory: 64M } } }
  pgbouncer-exporter: # PM-001: PgBouncer pool state (clients waiting, paused)
    profiles: ["observability"]
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1
    command: ["--pgBouncer.connectionString=postgres://localarena:${POSTGRES_PASSWORD:-localarena-dev}@pgbouncer:5432/pgbouncer?sslmode=disable"]
    deploy: { resources: { limits: { memory: 32M } } }
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # lab only: loopback-bound, read-only viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-dev}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    deploy: { resources: { limits: { memory: 384M } } }

  bots:
    profiles: ["load"]
    build: { context: ., target: bots }
    image: localarena/bots:dev
    pull_policy: build
    command: ["-server", "http://gameserver:8080", "-bots", "100", "-duration", "60s"]
    depends_on: [gameserver]

volumes:
  tempo-data:
  loki-data:
  gameserver-spool:
  streams-1:
  streams-2:
  kafka-1:
  kafka-2:
  kafka-3:
  garage-data:
  pg-primary:
  pg-replica:
